# Netlify build configuration, pinned in-repo so it no longer depends on
# dashboard settings left over from the Create React App setup.
[build]
  # Install with Bun, then build. We run `bun install` explicitly rather than
  # relying on Netlify's lockfile auto-detection: that only recognizes the
  # binary `bun.lockb`, but Bun >= 1.2 defaults to the text `bun.lock` we commit.
  command = "bun install --frozen-lockfile && bun run build"
  # Vite outputs to dist/ (Create React App used build/).
  publish = "dist"

[build.environment]
  # Pin Bun to match local development for reproducible builds.
  BUN_VERSION = "1.3.7"
  # Vite 7 requires Node >= 20.19 / >= 22.12. Bun runs the build, but some Vite
  # plugins still shell out to Node, so keep a compatible Node pinned too.
  NODE_VERSION = "22"

# Single-page app fallback for client-side routes only.
#
# Netlify serves a published file before applying a redirect unless `force`
# is true. Do not set force on the catch-all: that rewrites real files
# (sitemap, robots, icons, og image, resume PDF, hashed assets) to HTML,
# which is why /Avatar.jpg used to unfurl as a document.
#
# These explicit rules are listed first so the static paths stay files even
# if the catch-all is later edited. They are shadowed by the files themselves
# when those files exist in dist/.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/og.jpg"
  to = "/og.jpg"
  status = 200

[[redirects]]
  from = "/avatar.jpg"
  to = "/avatar.jpg"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

[[redirects]]
  from = "/favicon-32.png"
  to = "/favicon-32.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/icon-192.png"
  to = "/icon-192.png"
  status = 200

[[redirects]]
  from = "/icon-512.png"
  to = "/icon-512.png"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/Brandon-Delgado-Resume.pdf"
  to = "/Brandon-Delgado-Resume.pdf"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Proof and earlier-work pages are real files at /<path>/index.html.
# These rewrites run only when pretty URLs did not already match that file,
# so a request without a trailing slash still returns the prerendered HTML
# instead of the home-page fallback.
[[redirects]]
  from = "/proof/hardware-dispatch"
  to = "/proof/hardware-dispatch/index.html"
  status = 200

[[redirects]]
  from = "/proof/customer-dashboard"
  to = "/proof/customer-dashboard/index.html"
  status = 200

[[redirects]]
  from = "/proof/revenue-ledger"
  to = "/proof/revenue-ledger/index.html"
  status = 200

[[redirects]]
  from = "/proof/commerce-rebuild"
  to = "/proof/commerce-rebuild/index.html"
  status = 200

[[redirects]]
  from = "/proof/earnings-integration"
  to = "/proof/earnings-integration/index.html"
  status = 200

[[redirects]]
  from = "/proof/how-i-work"
  to = "/proof/how-i-work/index.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/work/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
